[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# HTTPS + canonical host enforcement (first matching rule wins)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "http://washertroubleshootsg.com/*"
  to = "https://washertroubleshootsg.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.washertroubleshootsg.com/*"
  to = "https://washertroubleshootsg.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.washertroubleshootsg.com/*"
  to = "https://washertroubleshootsg.com/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Legacy / duplicate URLs -> clean canonical URLs (301)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/terms&condition"
  to = "/terms-and-conditions"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Every real route is prerendered to dist/<route>/index.html, so no SPA
# catch-all rewrite is needed. Unknown URLs get dist/404.html with a real
# HTTP 404 status (no soft-404s).

# ---------------------------------------------------------------------------
# Security + performance headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
